; FasterEdge MCU (CW32F003) — platformio_ide 版
; VS Code + PlatformIO 插件直接打开本目录即可编译/烧录/监视串口
; 本版本为「裸机 C + Cortex-M0+ 寄存器级参考实现（芯源 CW32 平台）」
;
; 使用方法（VS Code）:
;   1. 安装 PlatformIO IDE 插件
;   2. 打开本目录 (platformio_ide)
;   3. 底部状态栏点 Build / Upload / Serial Monitor
;
; 注意:
;   - ARM GCC 工具链；CW32 无官方 PlatformIO 平台，需自建 board 或用 CMake/Makefile
;   - fe_port.c 为 CW32F003 寄存器级参考实现（RCC/GPIO/USART/SysTick）
;   - 寄存器名/地址以普冉官方头文件为准，如有差异请按头文件微调
[env:cw32f003]
platform = cw32
board = cw32f003
framework = none
monitor_speed = 115200
build_flags =
    -DFOSC=48000000UL
